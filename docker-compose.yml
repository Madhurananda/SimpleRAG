version: "3.9"

services:
  hr-assistant:
    build:
      context: .
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data

  interspeech:
    build:
      context: .
    command: streamlit run app_interspeech.py --server.address=0.0.0.0 --server.port=8501
    env_file:
      - .env
    ports:
      - "8502:8501"
    volumes:
      - ./data:/app/data

  unified:
    build:
      context: .
    command: streamlit run app_unified.py --server.address=0.0.0.0 --server.port=8501
    env_file:
      - .env
    ports:
      - "8503:8501"
    volumes:
      - ./data:/app/data